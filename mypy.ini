[mypy]
plugins = mypy_django_plugin.main
python_version = 3.12
ignore_missing_imports = True
strict = True
mypy_path = app

[mypy.plugins.django-stubs]
django_settings_module = app.settings

# Test files exercise the DRF test client, whose responses are typed as
# _MonkeyPatchedWSGIResponse (no `.data`) without djangorestframework-stubs.
# Adding drf-stubs introduces more errors in production code, so skip strict
# type checking of tests instead.
[mypy-*.tests.*]
ignore_errors = True
